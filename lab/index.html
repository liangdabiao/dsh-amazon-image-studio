<!doctype html>
<html lang="zh-CN" data-scheme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>亚马逊图片工作台</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<aside class="rail">
  <a class="brand" href="#/">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.5" y="4" width="19" height="14" rx="2"></rect>
        <path d="M7 13.5l3-3 2.5 2.5L16 9.5l3 4"></path>
        <circle cx="9" cy="8.5" r="1.2"></circle>
        <path d="M5 20.5c4.5 1.8 10.5 1.8 14.5-.4"></path>
      </svg>
    </span>
    <span class="brand-text"><b>亚马逊图片工作台</b><small>Listing / A+ · dsh-amazon-image-studio</small></span>
  </a>
  <nav class="nav">
    <div class="nav-group">策划</div>
    <a href="#/" data-view="home">策划台</a>
    <a href="#/plans" data-view="plans">策划档案<span class="count" id="nav-plans"></span></a>
    <a href="#/gallery" data-view="gallery">生成历史<span class="count" id="nav-history"></span></a>
    <div class="nav-group">工具</div>
    <a href="#/tagging" data-view="tagging">AI 人物打标</a>
    <div class="nav-group">方法</div>
    <a href="#/guide" data-view="guide">工作流与合规</a>
  </nav>
  <div class="rail-foot" id="rail-foot"></div>
</aside>

<main class="main" id="app"><div class="loading">加载中…</div></main>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="预览">
  <div class="viewer-bar">
    <span class="title" id="viewer-title"></span>
    <span class="grow"></span>
    <button id="viewer-copy" hidden title="复制">复制</button>
    <button id="viewer-close" title="关闭（Esc）">关闭</button>
  </div>
  <div class="viewer-body" id="viewer-body"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
